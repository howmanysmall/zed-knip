min_version = "2024.11.0"

[tools]
aube = "latest"
gitleaks = "latest"
lefthook = "latest"
node = "26"
rumdl = "latest"
tombi = "latest"
rust = "1.93.1"
"github:howmanysmall/pullhook" = "latest"
bun = "latest"

[env]
PROJECT_NAME = "{{ config_root | basename }}"
_.file = { path = ".env" }
_.path = ["{{config_root}}/node_modules/.bin", "{{cwd}}/node_modules/.bin"]

[settings]
auto_install = false
lockfile = true

[tasks]
audit = "cargo audit"
build = "cargo build"
build-release = "cargo build --release"
deny = "cargo deny check"
fmt = "cargo fmt --all"
install = "cargo install --path ."
lint = "cargo clippy --all-targets -- -D warnings"
test = "cargo nextest run"

bi = "cargo build"
br = "cargo build --release"
ti = "cargo nextest run"

ta = "cargo nextest run --all-targets --all-features"
bw = "cargo build --release --target wasm32-wasip2"
fa = "npm run format"
la = "aube run lint"
tc = "aube run type-check"
pc = "./scripts/pre-commit.sh"

[tasks.lockfile]
description = "Regenerate lockfile checksums for all tools, then install"
run = ["mise lock", "mise install"]

[tasks.lockfile-tool]
description = "Regenerate lockfile checksums for a specific tool, then install"
run = ["mise lock {{arg(name='tool')}}", "mise install"]

[tasks.test-all]
description = "Run the full test suite (unit + integration + all targets + all features)"
run = "cargo nextest run --all-targets --all-features"

[tasks.build-wasm]
description = "Build the release WASM artifact for Zed (wasm32-wasip2 target)"
run = "cargo build --release --target wasm32-wasip2"

[tasks.install-local]
description = "Build the WASM artifact and install it as a dev extension under Zed's installed/ directory"
run = '''
set -euo pipefail

echo "🔨 Building release WASM for Zed..."
cargo build --release --target wasm32-wasip2

if [[ "$OSTYPE" == "darwin"* ]]; then
  EXT_BASE="$HOME/Library/Application Support/Zed/extensions"
elif [[ "$OSTYPE" == "linux-gnu"* ]]; then
  EXT_BASE="${XDG_DATA_HOME:-$HOME/.local/share}/zed/extensions"
else
  echo "❌ Unsupported OS for automatic path detection."
  echo "   Set EXT_BASE manually, e.g.:"
  echo "   EXT_BASE=... mise run install-local"
  exit 1
fi

TARGET_DIR="$EXT_BASE/installed/zed-knip"

if [[ -L "$TARGET_DIR" ]]; then
  rm "$TARGET_DIR"
elif [[ -d "$TARGET_DIR" ]]; then
  rm -rf "$TARGET_DIR"
fi

mkdir -p "$TARGET_DIR"

echo "📦 Installing dev extension to: $TARGET_DIR"

cp -f extension.toml "$TARGET_DIR/"
cp -f "target/wasm32-wasip2/release/zed_knip.wasm" "$TARGET_DIR/extension.wasm"

echo ""
echo "✅ Dev extension installed."
echo ""
echo "Next steps:"
echo "  1. In Zed, open the command palette (Cmd+Shift+P / Ctrl+Shift+P)"
echo "  2. Run:  zed: reload extensions"
echo "     (or fully quit and restart Zed)"
echo ""
echo "Requirements:"
echo "  • Rust must be installed via rustup (not Homebrew)."
echo "  • The folder under installed/ must be named exactly 'zed-knip'."
echo "  • The WASM file must be named exactly 'extension.wasm'."
'''

[tasks.pre-commit]
description = "Run the full pre-commit gate (format + clippy + audit + deny + shear + gitleaks)"
run = "./scripts/pre-commit.sh"

[tasks.format-all]
description = "Format every file in the repo (Rust + JS/TS + Markdown + TOML + JSON)"
run = "npm run format"

[tasks.lint-all]
description = "Run the full lint pipeline via aube (oxlint + biome)"
run = "aube run lint"

[tasks.type-check]
description = "Type-check the TypeScript tooling code"
run = "aube run type-check"

[tasks.verify]
description = "Full local verification: all tests + clippy + WASM build"
run = [
	"cargo nextest run --all-targets --all-features",
	"cargo clippy --all-targets -- -D warnings",
	"cargo build --release --target wasm32-wasip2"
]
